# Builds the XRO node natively on amd64 and arm64, then stitches a manifest so
# `docker pull caltru1sm/xro-node:TAG` resolves correctly on a ZimaBoard, a
# Raspberry Pi 4/5, an Oracle Ampere A1, or Graviton.
#
# Native arm64 runners are the point. Emulated aarch64 builds of this tree
# (Boost + RocksDB + CryptoPP from source) take hours and intermittently
# segfault inside qemu-user-static; native arm64 completes in roughly the same
# time as amd64.
#
# Builds docker/xro/Dockerfile - the XRO image, which compiles from source and
# bakes the network identity. Not docker/node/Dockerfile, which is upstream's.
#
# Required repository secrets:
#   DOCKERHUB_USERNAME
#   DOCKERHUB_TOKEN      (access token, not the account password)

name: Build XRO node (multi-arch)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. 2.0.1)"
        required: true
        default: "xro-dev"
      latest:
        description: "Also move :latest to this build"
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "xro-node-*"

env:
  IMAGE: caltru1sm/xro-node

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            suffix: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      # Submodules are mandatory: Boost is vendored as the full boostorg
      # superproject with nested submodules, and a non-recursive checkout fails
      # at CMake configure with a misleading Boost_INCLUDE_DIR error.
      - name: Check out with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          df -h

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Git tags are named xro-node-2.0.3, so they read and sort as releases on
      # GitHub. The image tag has to be the bare version - a node reports
      # node_vendor from CI_TAG, and "Nano xro-node-2.0.0-R2" is what the old
      # ref_name passthrough produced. Stripping the prefix means a tag-triggered
      # release publishes under the same name a workflow_dispatch build would,
      # instead of a parallel caltru1sm/xro-node:xro-node-2.0.3.
      - name: Resolve tag
        id: meta
        run: |
          set -eu
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            tag="${{ github.event.inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME#xro-node-}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "resolved image tag: ${tag}"

      - name: Build and push ${{ matrix.suffix }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/xro/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}-${{ matrix.suffix }}
          # CI_TAG is a display string only (node_vendor / --version). The
          # wire-visible version peers compare stays at CMakeLists' 28.0.0.
          #
          # NANO_SIMD_OPTIMIZATIONS is deliberately absent: ci/build.sh never
          # passes it and its CMake default is OFF, so aarch64 already compiles
          # -march=armv8-a. That baseline is what a published image wants - the
          # +crc+crypto path is faster but can SIGILL on older ARMv8 cores.
          build-args: |
            CI_TAG=${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=xro-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=xro-${{ matrix.suffix }}

      - name: Smoke test ${{ matrix.suffix }}
        run: |
          set -euxo pipefail
          IMG=${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}-${{ matrix.suffix }}

          # The binary runs at all on this architecture. Catches a SIGILL from
          # an over-tuned -march before it reaches anyone's Pi.
          docker run --rm --entrypoint /bin/nan_node "$IMG" --version

          # The baked identity survived into the image and the preflight
          # accepts it. Asserting on the address prefix rather than the exit
          # code, because a node that silently fell back to Nano's genesis
          # would also exit 0 here.
          identity=$(docker run --rm --entrypoint /bin/sh "$IMG" -c \
            'printenv prefix account source work signature name peering peering_port')
          echo "$identity"
          grep -qx 'xro_' <<<"$identity"

          # The preflight rejects a bad override. If this stops failing, the
          # guard has silently stopped guarding.
          #
          # Output is captured before being matched rather than piped into
          # grep. Under `set -o pipefail` a pipeline reports the last non-zero
          # status in it, so `docker run ... | grep -q` returns the guard's own
          # exit 78 even when grep matches - i.e. the guard working correctly
          # would fail this check. Capturing separates "what did it print" from
          # "how did it exit" so both can be asserted independently.
          out=$(docker run --rm \
                  -e source=E89208DD038FBB269987689621D52292AE9C35941A7484756ECCED92A65093BA \
                  "$IMG" 2>&1) && rc=0 || rc=$?
          echo "$out"
          if [ "$rc" -eq 78 ] && grep -q "XRO STARTUP ABORTED" <<<"$out"; then
            echo "preflight correctly rejected Nano mainnet genesis (exit 78)"
          else
            echo "PREFLIGHT DID NOT FIRE on Nano mainnet genesis (exit ${rc})" >&2
            exit 1
          fi

      # The healthcheck probes the bind in config-rpc.toml rather than assuming
      # loopback. Asserted here because the failure is invisible to every other
      # check in this workflow: the node runs correctly and only the health flag
      # is wrong, so a build can go green while the image reports a perfectly
      # healthy node as dead. See docker/xro/test-healthcheck.sh.
      - name: Healthcheck smoke test ${{ matrix.suffix }}
        run: |
          docker/xro/test-healthcheck.sh \
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}-${{ matrix.suffix }}

  manifest:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Git tags are named xro-node-2.0.3, so they read and sort as releases on
      # GitHub. The image tag has to be the bare version - a node reports
      # node_vendor from CI_TAG, and "Nano xro-node-2.0.0-R2" is what the old
      # ref_name passthrough produced. Stripping the prefix means a tag-triggered
      # release publishes under the same name a workflow_dispatch build would,
      # instead of a parallel caltru1sm/xro-node:xro-node-2.0.3.
      - name: Resolve tag
        id: meta
        run: |
          set -eu
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            tag="${{ github.event.inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME#xro-node-}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "resolved image tag: ${tag}"

      # Per-architecture tags are pushed first and the manifest is created last,
      # so the tag production pulls is never in a half-updated state.
      - name: Create and push manifest
        run: |
          set -eux
          TAG=${{ steps.meta.outputs.tag }}
          docker buildx imagetools create -t ${{ env.IMAGE }}:${TAG} \
            ${{ env.IMAGE }}:${TAG}-amd64 \
            ${{ env.IMAGE }}:${TAG}-arm64
          docker buildx imagetools inspect ${{ env.IMAGE }}:${TAG}

      # :latest always points at the newest release, so an operator who pulls
      # caltru1sm/xro-node:latest gets the current node on either architecture -
      # the manifest above carries both, so there is no arm64-specific tag to
      # find. Tagging a release is therefore the act of promoting it.
      #
      # Scoped to tag pushes rather than every run: workflow_dispatch defaults
      # to the xro-dev tag and is how throwaway builds get made, and those must
      # not become what the world pulls. A dispatch can still promote
      # deliberately by passing latest=true.
      #
      # The consequence to be aware of: a tag push publishes to :latest before
      # the build has run on real hardware. CI covers the binary, the baked
      # identity, the preflight and the healthcheck, but not a live sync. Tag
      # when you are ready for everyone to have it.
      - name: Move :latest
        if: github.event.inputs.latest == 'true' || startsWith(github.ref, 'refs/tags/')
        run: |
          set -eux
          TAG=${{ steps.meta.outputs.tag }}
          docker buildx imagetools create -t ${{ env.IMAGE }}:latest \
            ${{ env.IMAGE }}:${TAG}-amd64 \
            ${{ env.IMAGE }}:${TAG}-arm64
          docker buildx imagetools inspect ${{ env.IMAGE }}:latest
